<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#121212">
<title>軍團 TA 發放公告</title>
<style>
:root{--bg:#121212;--card:#1e1e1e;--accent:#d4af37;--text:#e0e0e0;--muted:#999;--border:#333}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Microsoft JhengHei",Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:16px;min-height:100vh}
.container{width:100%;max-width:520px;margin:0 auto}
.header{text-align:center;padding:18px 10px 12px}
h1{color:var(--accent);font-size:1.45rem;margin:0 0 6px}
.subtitle{color:var(--muted);font-size:.82rem}
.lang{display:flex;justify-content:center;gap:8px;margin:8px 0 16px}
.lang button{background:#252525;color:#aaa;border:1px solid var(--border);padding:7px 17px;border-radius:20px;cursor:pointer}
.lang button.active{background:var(--accent);color:#000;font-weight:bold}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:17px;box-shadow:0 4px 20px rgba(0,0,0,.45)}
.pool{text-align:center;background:#252525;border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px}
.pool-label{font-size:.78rem;color:var(--muted)}
.pool-value{font-size:1.8rem;color:var(--accent);font-weight:bold;margin-top:3px}
.input{width:100%;margin-top:9px;background:#171717;border:1px solid var(--accent);border-radius:7px;color:#fff;padding:9px;text-align:center;font-size:1rem}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{padding:9px 5px;border-bottom:1px solid var(--border);text-align:center}
th{color:var(--accent);background:#252525}
tr:nth-child(even){background:#181818}
.weight{color:var(--accent);font-weight:bold}
.ta{color:#6fcf97;font-size:1.05rem;font-weight:bold}
.total{display:flex;justify-content:space-between;margin-top:13px;padding:10px;background:#252525;border-radius:8px;font-size:.82rem}
.total strong{color:var(--accent)}
.announcement{margin-top:14px;padding:14px;background:#111;border:1px solid var(--accent);border-radius:10px;white-space:pre-wrap;line-height:1.6;font-size:.84rem}
.copy{width:100%;border:0;border-radius:7px;background:var(--accent);color:#000;padding:12px;margin-top:12px;font-weight:bold;font-size:.95rem;cursor:pointer}
.note{text-align:center;color:#666;font-size:.7rem;line-height:1.5;margin:13px 5px}
footer{text-align:center;color:#555;font-size:.68rem;padding:12px}
@media(max-width:400px){table{font-size:.8rem}th,td{padding:8px 3px}}
</style>
</head>
<body>
<div class="container">

<header class="header">
<h1 id="title">📢 軍團 TA 發放公告</h1>
<div class="subtitle" id="subtitle">61 人制｜TA 貢獻分數級距表</div>
</header>

<div class="lang">
<button id="zh" class="active" onclick="setLang('zh')">中文</button>
<button id="en" onclick="setLang('en')">English</button>
</div>

<main class="card">

<div class="pool">
<div class="pool-label" id="poolLabel">本週 TA 總庫存</div>
<div class="pool-value"><span id="poolValue">550</span> TA</div>
<input id="stock" class="input" type="number" min="0" value="550" oninput="calculate()">
</div>

<table>
<thead>
<tr>
<th id="tierHead">貢獻分數區段</th>
<th id="weightHead">權重</th>
<th id="taHead">個人可領 TA</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>

<div class="total">
<span id="baseLabel">全團總權重底數</span>
<strong>610</strong>
</div>

<div class="total">
<span id="sumLabel">各級距 TA 加總</span>
<strong id="sum">0 TA</strong>
</div>

<div class="announcement" id="announcement"></div>

<button class="copy" id="copyBtn" onclick="copyAnnouncement()">複製公告</button>

</main>

<div class="note" id="note">
依原始 61 人版設定：總權重底數固定為 610；個人 TA = 四捨五入（權重 ÷ 610 × 本週 TA 總庫存）。
</div>

<footer>TA Distribution • GitHub Pages</footer>

</div>

<script>
const TOTAL_WEIGHT=610;

const tiers=[
{zh:"0 – 2000 分",en:"0 – 2000",w:0},
{zh:"2001 – 3000 分",en:"2001 – 3000",w:3},
{zh:"3001 – 4000 分",en:"3001 – 4000",w:4},
{zh:"4001 – 5000 分",en:"4001 – 5000",w:5},
{zh:"5001 – 6000 分",en:"5001 – 6000",w:6},
{zh:"6001 – 7000 分",en:"6001 – 7000",w:9},
{zh:"7001 – 8000 分",en:"7001 – 8000",w:13},
{zh:"8001 – 9000 分",en:"8001 – 9000",w:16},
{zh:"9001 – 10000 分",en:"9001 – 10000",w:19},
{zh:"10001 – 12000 分",en:"10001 – 12000",w:22},
{zh:"12001 分以上",en:"12001+",w:25}
];

let lang="zh";

const labels={
zh:{
title:"📢 軍團 TA 發放公告",
subtitle:"61 人制｜TA 貢獻分數級距表",
pool:"本週 TA 總庫存",
tier:"貢獻分數區段",
weight:"權重",
ta:"個人可領 TA",
base:"全團總權重底數",
sum:"各級距 TA 加總",
copy:"複製公告",
note:"依原始 61 人版設定：總權重底數固定為 610；個人 TA = 四捨五入（權重 ÷ 610 × 本週 TA 總庫存）。",
copied:"公告已複製！"
},
en:{
title:"📢 Legion TA Distribution",
subtitle:"61 Members | TA contribution tier table",
pool:"Weekly TA Pool",
tier:"Contribution Range",
weight:"Weight",
ta:"TA per Member",
base:"Total Weight Base",
sum:"Total TA by Tier",
copy:"Copy Announcement",
note:"Original 61-member setting: fixed total weight base = 610; TA per member = round(weight ÷ 610 × weekly TA pool).",
copied:"Announcement copied!"
}
};

function calculate(){
const stock=Math.max(0,parseFloat(document.getElementById("stock").value)||0);
document.getElementById("poolValue").textContent=stock;
let total=0;
let html="";
tiers.forEach(t=>{
const value=Math.round((t.w/TOTAL_WEIGHT)*stock);
total+=value;
html+=`<tr><td>${t[lang]}</td><td class="weight">${t.w}</td><td class="ta">${value} TA</td></tr>`;
});
document.getElementById("rows").innerHTML=html;
document.getElementById("sum").textContent=total+" TA";
document.getElementById("announcement").textContent=buildAnnouncement(stock);
}

function buildAnnouncement(stock){
let s="";
if(lang==="zh"){
s+=`📢 本週軍團 TA 發放公告（全團61人）\n`;
s+=`TA 總庫存：${stock} TA\n\n`;
tiers.forEach(t=>{
const v=Math.round((t.w/TOTAL_WEIGHT)*stock);
s+=`• ${t.zh} ➔ 領 ${v} TA\n`;
});
}else{
s+=`📢 Weekly Legion TA Distribution (61 Members)\n`;
s+=`Total TA Pool: ${stock} TA\n\n`;
tiers.forEach(t=>{
const v=Math.round((t.w/TOTAL_WEIGHT)*stock);
s+=`• ${t.en} ➔ ${v} TA\n`;
});
}
return s;
}

function copyAnnouncement(){
const text=buildAnnouncement(Math.max(0,parseFloat(document.getElementById("stock").value)||0));
if(navigator.clipboard&&window.isSecureContext){
navigator.clipboard.writeText(text).then(()=>alert(labels[lang].copied));
}else{
const area=document.createElement("textarea");
area.value=text;document.body.appendChild(area);area.select();document.execCommand("copy");area.remove();
alert(labels[lang].copied);
}
}

function setLang(l){
lang=l;
document.documentElement.lang=l==="zh"?"zh-TW":"en";
document.getElementById("zh").classList.toggle("active",l==="zh");
document.getElementById("en").classList.toggle("active",l==="en");
const x=labels[l];
document.getElementById("title").textContent=x.title;
document.getElementById("subtitle").textContent=x.subtitle;
document.getElementById("poolLabel").textContent=x.pool;
document.getElementById("tierHead").textContent=x.tier;
document.getElementById("weightHead").textContent=x.weight;
document.getElementById("taHead").textContent=x.ta;
document.getElementById("baseLabel").textContent=x.base;
document.getElementById("sumLabel").textContent=x.sum;
document.getElementById("copyBtn").textContent=x.copy;
document.getElementById("note").textContent=x.note;
calculate();
}

calculate();
</script>
</body>
</html>
